name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: alhinnawi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d alhinnawi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alhinnawi_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      STORAGE_DRIVER: local
      MEDIA_ROOT: /tmp/alhinnawi-media
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:3000/api/media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Seed test database
        run: pnpm db:seed
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Database integration tests
        run: RUN_DB_TESTS=1 pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Mobile end-to-end tests
        run: pnpm test:e2e --project=mobile
      - name: Build production Docker image
        run: docker build -t al-hinnawi:${{ github.sha }} .
      - name: Verify production worker runtime
        run: |
          docker run --rm --entrypoint node al-hinnawi:${{ github.sha }} -e "const { createRequire } = require('node:module'); createRequire('/app/.ops/media-worker.cjs')('sharp'); console.log('sharp runtime ok')"
          docker run --rm --entrypoint node al-hinnawi:${{ github.sha }} --check .ops/media-worker.cjs
