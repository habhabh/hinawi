services:
  - type: web
    name: hinawi
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node .ops/render-start.mjs
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    domains:
      - show.alhennawi.sa
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        value: https://show.alhennawi.sa
      - key: BETTER_AUTH_URL
        value: https://show.alhennawi.sa
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://show.alhennawi.sa
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ANALYTICS_SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hinawi-db
          property: connectionString
      - key: DATABASE_MIGRATION_URL
        fromDatabase:
          name: hinawi-db
          property: connectionString
      - key: DB_POOL_MAX
        value: 5
      - key: DB_IDLE_TIMEOUT
        value: 30000
      - key: DB_CONNECTION_TIMEOUT
        value: 5000
      - key: STORAGE_DRIVER
        value: local
      - key: MEDIA_ROOT
        value: /data/media
      - key: MEDIA_PUBLIC_BASE_URL
        value: https://show.alhennawi.sa/api/media
      - key: IMAGE_MAX_SIZE_MB
        value: 20
      - key: VIDEO_MAX_SIZE_MB
        value: 150
      - key: SUPER_ADMIN_NAME
        value: مدير النظام
      - key: SUPER_ADMIN_EMAIL
        value: ali.ogmd@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
    disk:
      name: hinawi-media
      mountPath: /data/media
      sizeGB: 10

databases:
  - name: hinawi-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: alhinnawi
    user: alhinnawi
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []

